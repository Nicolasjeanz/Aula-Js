<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Atividade 4</title>
    </head>
    <body>
        <script>
            
            let a = parseInt(prompt("Digite um numero para verificar se é par ou impar :"));

            const verificarParImpar = (numeroA) => {
                let tipoNumero = "";
                if(numeroA % 2 === 0) {
                    tipoNumero = "Par";
                } else {
                    tipoNumero = "Impar";
                }

                alert (`${numeroA} é ${tipoNumero}`);
            }

            verificarParImpar(a)
        </script>
    </body>
</html>
